name: Apply OGC upstream cleanup

on:
  push:
    branches:
      - wms-wmts-online-backgrounds-stage

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wms-wmts-online-backgrounds-stage

      - name: Remove staging reconstruction artifacts
        shell: python
        run: |
          from pathlib import Path

          packaging = Path("packaging/CMakeLists.txt")
          text = packaging.read_text(encoding="utf-8")
          malformed = '([^\\\n]*).*"'
          corrected = '([^\\n]*).*"'
          if malformed not in text:
              raise SystemExit("Malformed CMake escape anchor not found")
          packaging.write_text(text.replace(malformed, corrected, 1), encoding="utf-8")

          template = Path("src/templates/template.cpp")
          text = template.read_text(encoding="utf-8")
          old = 'void Template::deletePassPoint(int pos)\n{\n\tQ_ASSERT(!is_georeferenced);\n\tpasspoints.erase(passpoints.begin() + pos);\n}'
          new = 'void Template::deletePassPoint(int pos)\n{\n\tpasspoints.erase(passpoints.begin() + pos);\n}'
          if old not in text:
              raise SystemExit("Unexpected Template::deletePassPoint body")
          template.write_text(text.replace(old, new, 1), encoding="utf-8")

          header = Path("src/gdal/gdal_ogc_catalog.h")
          text = header.read_text(encoding="utf-8")
          text = text.replace('#include <QCoreApplication>\n', '', 1)
          text = text.replace('\tQ_DECLARE_TR_FUNCTIONS(OpenOrienteering::GdalOgcCatalog)\n\n', '', 1)
          header.write_text(text, encoding="utf-8")

      - name: Commit cleanup
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/CMakeLists.txt src/templates/template.cpp src/gdal/gdal_ogc_catalog.h
          git commit -m "Clean upstream WMS/WMTS candidate"
          git push origin HEAD:wms-wmts-online-backgrounds-stage
